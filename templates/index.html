<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deteksi Sampah</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="../static/styles.css" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <button class="navbar-toggler custom-toggler" type="button">
                <i class="fa-solid fa-bars fa-xl text-white"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="menu-header d-lg-none">
                    <button class="close-menu-btn navbar-toggler">
                        <i class="fa-solid fa-arrow-left fa-lg text-white"></i>
                    </button>
                </div>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.path=='/' %}active-nav{% endif %}" href="/">Utama</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.path=='/lokasi' %}active-nav{% endif %}" href="/lokasi">Lokasi Bank Sampah</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="text-center py-5" style="background-color: #4E8A16;">
        <div class="text-white p-4">
            <h1 class="fw-bold">Selamat Datang!</h1>
            <p>Unggah <i>file</i> gambar sampah atau aktifkan kamera untuk deteksi <i>real-time</i>.</p>
        </div>
    </div>

    <div class="container text-center py-5">
        <div class="row mt-4">
            <div class="col-md-6">
                <!-- Kategori -->
                <label for="kategori" class="form-label fw-bold d-block fs-5">Kategori Sampah:</label>
                <div class="select-wrapper">
                    <select name="kategori" id="kategori" class="form-select text-center mx-auto" style="width: 150px;">
                        <option value="semua">Semua</option>
                        <option value="organik">Organik</option>
                        <option value="anorganik">Anorganik</option>
                        <option value="b3">B3</option>
                    </select>
                    <i id="arrow" class="fa-solid fa-chevron-down"></i>
                </div>
            </div>
            <div class="col-md-6">
                <!-- Threshold -->
                <label for="confidence-score" class="form-label fw-bold d-block fs-5">Batas Nilai Keyakinan:</label>
                <div class="d-flex align-items-center justify-content-center">
                    <input type="range" id="confidence-score" min="0" max="100" value="50" step="1"
                        oninput="document.getElementById('confScore').innerText=this.value+'%'"
                    />
                    <p><span id="confScore">50%</span></p>
                </div>
            </div>
        </div>

        <!-- Upload -->
        <div class="mt-4">
            <p class="text-muted" id="uploadStatus"><i>Belum ada gambar yang diunggah</i></p>
            <div id="actionButton" class="mt-4 d-flex align-items-center justify-content-center button">
                <input type="file" id="fileInput" class="d-none" accept="image/*" />
                <button class="btn text-white fw-bold me-2 unggah-gambar"
                    style="background-color: #73CA22; width: 200px;"
                    onclick="document.getElementById('fileInput').click()"
                >
                    Unggah Gambar
                </button>
                <button class="icon-btn" id="cameraBtn">
                    <i class="fa-solid fa-camera fa-2x"></i>
                </button>
            </div>
        </div>

        <div id="cameraContainer" class="mt-6 d-none">
            <h5 class="fw-bold">Live Detection</h5>
            <img id="cameraFeed" class="img-fluid border rounded shadow-sm">
            <div class="mt-2">
                <button class="btn btn-danger fw-bold unggah-gambar" style="width: 200px;" onclick="stopCamera()">Matikan Kamera</button>
            </div>
        </div>
        
        <div id="recommendation" class="mt-3 text-start d-none"></div>
    </div>
    
    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

    <script src="../static/index.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
