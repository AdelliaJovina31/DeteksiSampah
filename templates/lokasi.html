<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deteksi Sampah</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="../static/styles.css" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <button class="navbar-toggler custom-toggler" type="button">
                <i class="fa-solid fa-bars fa-xl text-white"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="menu-header d-lg-none">
                    <button class="close-menu-btn navbar-toggler">
                        <i class="fa-solid fa-arrow-left fa-lg text-white"></i>
                    </button>
                </div>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.path=='/' %}active-nav{% endif %}" href="/">Utama</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.path=='/lokasi' %}active-nav{% endif %}" href="/lokasi">Lokasi Bank Sampah</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="text-center py-5" style="background-color: #4E8A16;">
        <div class="text-white p-4">
            <h1 class="fw-bold">Lokasi Bank Sampah</h1>
            <p>Aktifkan lokasi perangkat Anda dan temukan lokasi bank sampah terdekat.</p>
        </div>
    </div>

    <div class="container">
        <div class="card rounded-4">
            <div class="card-body p-0">
                <div id="map"></div>
            </div>
        </div>
    </div>
    
    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

    <script src="../static/index.js"></script>
    <script src="../static/lokasi.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
